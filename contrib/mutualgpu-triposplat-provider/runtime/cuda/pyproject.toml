[project]
name = "mutualgpu-triposplat-cuda-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6",
  "pillow==11.2.1",
  "safetensors==0.5.3",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "tqdm==4.67.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

