[project]
name = "mutualgpu-triposplat-rocm-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6",
  "pillow==11.2.1",
  "pytorch-triton-rocm==3.4.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "safetensors==0.5.3",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "tqdm==4.67.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
pytorch-triton-rocm = { index = "pytorch-rocm" }

